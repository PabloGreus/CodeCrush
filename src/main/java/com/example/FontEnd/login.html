<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
<style>
    body {
    background-color: rgb(97, 91, 91);
    font-family: Arial;
    }
    
    h1 {
        text-align: center;
        color: darkblue;
    }
    input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
 
    button {
        background-color: darkblue;
        color: white;
        padding: 10px;
        width: 100%;
        border: none;
        cursor: pointer;
        }
 
    button:hover {
        background-color: blue;
    }
 
    p {
        font-size: 12px;
        text-align: center;
    }
 
    a {
        color: darkblue;
    }
</style>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
 
    <div class="caja">
        <h1>Iniciar Sesion</h1>
 
        <form  id="formLogin" action="" method="post">
 
            <label>Usuario:</label><br>
            <input type="text" placeholder="Escribe tu usuario"><br>
 
            <label>Contraseña:</label><br>
            <input type="password" placeholder="Escribe tu contraseña"><br>
 
            <button type="submit">ENTRAR</button>
 
        </form>
 
        <p>¿No tienes cuenta? <a href="Registrer.html">Registrate aqui</a></p>
 
    </div>
 
</body>
</html>
