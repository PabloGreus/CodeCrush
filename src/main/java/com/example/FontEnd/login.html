<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCrush – Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
 
    <div class="card">
 
        <a href="index.html" class="back-link">← Volver al inicio</a>
 
        <h1>Iniciar Sesión</h1>
        <p class="subtitle">// Conecta y encuentra tu match</p>
 
        <form id="formLogin" action="" method="post">
 
            <div class="field">
                <label for="usuario">CORREO</label>
                    <div class="input-wrap">
                        <span class="input-icon">📧</span>
                        <input type="email" id="usuario" name="usuario" 
                            placeholder="tu@correo.com" required>
                    </div>
            </div>
 
            <div class="field">
                <label for="password">CONTRASEÑA</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
 
            <button type="submit" class="btn-primary">→ ENTRAR</button>
 
        </form>
 
        <hr class="divider">
 
        <p class="footer-text">
            ¿No tienes cuenta? <a href="Registrer.html">Regístrate aquí</a>
        </p>
        
         <script src="Formlogin.js"></script>
    </div>
 
</body>
</html>
