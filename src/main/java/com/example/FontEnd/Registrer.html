<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCrush – Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
 
    <div class="card">
 
        <a href="index.html" class="back-link">← Volver al inicio</a>
 
        <h1>Crear cuenta</h1>
        <p class="subtitle">// Tu historia de amor en código empieza aquí</p>
 
        <form id="FormRegistrer" action="#" method="POST">
 
            <div class="field">
                <label for="nombre">NOMBRE</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>
            </div>
 
            <div class="field">
                <label for="correo">CORREO ELECTRÓNICO</label>
                <div class="input-wrap">
                    <span class="input-icon">📧</span>
                    <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
                </div>
            </div>
 
            <div class="field">
                <label for="password">CONTRASEÑA</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
 
            <div class="field">
                <label for="bio">BIO <span style="opacity:0.5;">(opcional)</span></label>
                <textarea id="bio" name="bio" placeholder="Cuéntanos algo sobre ti... ¿qué stack usas? ¿tabs o spaces?"></textarea>
            </div>
 
            <span class="chips-label">TUS TECNOLOGÍAS</span>
            <div class="chips">
                <input type="checkbox" id="js"     name="techs" value="js">     <label for="js">JavaScript</label>
                <input type="checkbox" id="py"     name="techs" value="py">     <label for="py">Python</label>
                <input type="checkbox" id="java"   name="techs" value="java">   <label for="java">Java</label>
                <input type="checkbox" id="ts"     name="techs" value="ts">     <label for="ts">TypeScript</label>
                <input type="checkbox" id="sql"    name="techs" value="sql">    <label for="sql">SQL</label>
                <input type="checkbox" id="react"  name="techs" value="react">  <label for="react">React</label>
                <input type="checkbox" id="css"    name="techs" value="css">    <label for="css">CSS</label>
                <input type="checkbox" id="csharp" name="techs" value="csharp"> <label for="csharp">C#</label>
            </div>
 
            <button type="submit" class="btn-primary">✦ REGISTRARSE</button>
 
        </form>
 
        <hr class="divider">
 
        <p class="footer-text">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
    </div>
    <script src="Formregistrer.js"></script>
</body>
</html>
