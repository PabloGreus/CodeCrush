<!DOCTYPE html>
<html lang="es">

    <title>CodeCrush – Mis Matches</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="MatchesStyle.css">
</head>
<body>
 
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

    <div class="card matches-card">
 
        <div class="matches-header">
            <a href="Dashboard.html" class="back-link">← Volver</a>

        <div id="matchesArea">

    <script src="Machesfuncion.js"></script>
