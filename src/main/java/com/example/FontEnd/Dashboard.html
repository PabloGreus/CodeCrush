<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCrush – Perfiles</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="DashboardStyle.css">
</head>
<body>
 
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
 
    <div class="card perfiles-card">
 
        <div class="perfiles-header">
            <a href="index.html" class="back-link">← Volver al inicio</a>
            <span id="counter" class="perfiles-counter">– / –</span>
        </div>
 
        <h1>Encuentra tu<br>match 💻</h1>
        <p class="subtitle">// Desliza y conecta con devs afines</p>
 
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
 
        <div id="mainArea">
            <div class="state-box">
                <div class="spinner"></div>
                <p>Cargando perfiles...</p>
            </div>
        </div>
 
        <div class="action-btns" id="actionBtns" style="display:none">
            <button class="btn-action btn-nope"  onclick="swipeCard('left')"  title="Pasar">✕</button>
            <button class="btn-action btn-like"  onclick="swipeCard('right')" title="Like">❤️</button>
            <button class="btn-action btn-skip"  onclick="swipeCard('up')"   title="Saltar">↺</button>
        </div>
 
        <hr class="divider">
 
        <p class="footer-text">// Tu próximo commit podría ser al amor 💻</p>
 
    </div>
 
    <div class="toast" id="toast"></div>
 
    <script src="Dashboardfuncion.js"></script>
 
</body>
</html>
